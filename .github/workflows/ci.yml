name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    name: check (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build (fake env values, nothing is called)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-real-0000000000
          NEXT_PUBLIC_SITE_URL: https://example.com
      - name: Secret scan of the browser bundle
        run: |
          if grep -R -l -E "service_role|SUPABASE_SERVICE_ROLE_KEY|SEND_SMS_HOOK_SECRET|CRON_SECRET|TWILIO_AUTH_TOKEN" .next/static; then
            echo "A server-only name appears in the browser bundle"; exit 1
          fi
          echo "Browser bundle is clean"

  db-tests:
    name: db-tests (SQL migrations and security rules)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply stub, migrations and run every test
        run: |
          set -e
          createdb obn_test
          for f in supabase/tests/stub_auth.sql supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q obn_test -f "$f"
          done
          for t in supabase/tests/rls_test.sql supabase/tests/otp_attempts_test.sql supabase/tests/ref_region_test.sql supabase/tests/telegram_link_test.sql; do
            psql -v ON_ERROR_STOP=1 obn_test -f "$t" 2>&1 | tee /tmp/out.txt
            grep -q -E "ALL TESTS PASSED|OTP TESTS PASSED|REF REGION TESTS PASSED|TELEGRAM TESTS PASSED" /tmp/out.txt
          done
